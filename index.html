<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PID Controller Visualizer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app-container">
  <header>
    <h1>PID Controller Visualizer</h1>
  </header>

  <main class="content">
    <div class="controls-card">
      <h3>Tuning Parameters</h3>

      <div class="control-group">
        <label for="kp">Proportional (Kp): <span id="kp-val">1.20</span></label>
        <input type="range" id="kp" min="0" max="5" step="0.01" value="1.2">
      </div>

      <div class="control-group">
        <label for="ki">Integral (Ki): <span id="ki-val">0.05</span></label>
        <input type="range" id="ki" min="0" max="2" step="0.001" value="0.05">
      </div>

      <div class="control-group">
        <label for="kd">Derivative (Kd): <span id="kd-val">0.50</span></label>
        <input type="range" id="kd" min="0" max="3" step="0.01" value="0.5">
      </div>

      <div class="control-group">
        <label for="setpoint">Target Setpoint: <span id="setpoint-val">200</span></label>
        <input type="range" id="setpoint" min="0" max="1000" step="1" value="200">
      </div>

      <button id="reset-btn">Reset Simulation</button>
    </div>

    <div class="visualizer-card">
      <canvas id="simCanvas" width="600" height="300"></canvas>
    </div>
  </main>
</div>

<script src="/main.js"></script>
</body>
</html>
